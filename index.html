<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GSH Maintenance</title>
<meta name="theme-color" content="#10582F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GSH Maintenance">
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="icon" type="image/png" href="icon-192-v2.png">
<style>
  :root { --green:#10582F; --black:#111; }
  html, body { margin:0; padding:0; height:100%; background:#fff; overflow:hidden; }
  #app { position:fixed; inset:0; width:100%; height:100%; height:100dvh; border:0; display:block; background:#fff; }
  #splash { position:fixed; inset:0; z-index:2; background:radial-gradient(90% 55% at 50% 45%,#f4faf6 0%,#fff 70%); font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif; transition:opacity .35s ease; }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash.gone { display:none; }
  .sp-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; }
  .sp-meters { display:flex; gap:26px; direction:ltr; }
  .sp-meter { width:100px; opacity:0; transform:translateY(8px); filter:drop-shadow(0 6px 10px rgba(6,40,20,.12)); animation:spUp .8s cubic-bezier(.22,1,.36,1) forwards; }
  .sp-meter:nth-child(2) { animation-delay:.12s; }
  .sp-meter svg { width:100%; height:auto; display:block; overflow:visible; }
  .sp-brand { display:flex; flex-direction:column; align-items:center; gap:16px; }
  .sp-lg { position:relative; width:190px; max-width:52vw; aspect-ratio:520/191; opacity:0; transform:scale(.95); filter:blur(10px); animation:spIn 1.1s .45s cubic-bezier(.22,1,.36,1) forwards; }
  .sp-lg img { width:100%; height:100%; display:block; }
  .sp-sheen { position:absolute; inset:0; -webkit-mask:url(logo.png) center/100% 100% no-repeat; mask:url(logo.png) center/100% 100% no-repeat;
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.85) 48%,rgba(255,255,255,.95) 50%,rgba(255,255,255,.85) 52%,transparent 65%) no-repeat; background-size:250% 100%; background-position:120% 0; animation:spSweep 1.1s 1.2s ease-in-out forwards; }
  .sp-tag { display:flex; flex-direction:column; align-items:center; gap:11px; }
  .sp-rule { height:1px; width:0; background:linear-gradient(90deg,transparent,#0a6b35,transparent); animation:spRule .9s 1.2s cubic-bezier(.22,1,.36,1) forwards; }
  .sp-prod { font:600 11px "Segoe UI",Roboto,Arial,sans-serif; color:#064a24; text-transform:uppercase; direction:ltr; opacity:0; letter-spacing:1.6em; margin-right:-1.6em; animation:spTrack 1.1s 1.3s cubic-bezier(.22,1,.36,1) forwards; }
  .sp-foot { position:absolute; bottom:calc(40px + env(safe-area-inset-bottom,0px)); left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:10px; opacity:0; animation:spFade .6s .3s forwards; }
  .sp-certs { display:flex; align-items:center; justify-content:center; gap:10px; direction:ltr; margin-bottom:4px; }
  .sp-certs img { height:28px; width:auto; max-width:40px; object-fit:contain; display:block; opacity:0; transform:translateY(6px); animation:spUp .7s cubic-bezier(.22,1,.36,1) forwards; animation-delay:1.5s; }
  .sp-certs img:nth-child(2) { animation-delay:1.6s; }
  .sp-certs img:nth-child(3) { animation-delay:1.7s; }
  .sp-certs img:nth-child(4) { animation-delay:1.8s; }
  .sp-certs img:nth-child(5) { animation-delay:1.9s; }
  .sp-line { width:110px; height:2px; border-radius:2px; background:#e3e9e5; overflow:hidden; position:relative; }
  .sp-line::after { content:""; position:absolute; inset:0; width:40%; background:#0a6b35; border-radius:2px; animation:spSlide 1.2s cubic-bezier(.6,0,.4,1) infinite; }
  .sp-say { font-size:12.5px; color:#7c8a82; direction:rtl; }
  @keyframes spUp { to { opacity:1; transform:none; } }
  @keyframes spIn { to { opacity:1; transform:none; filter:none; } }
  @keyframes spSweep { to { background-position:-30% 0; } }
  @keyframes spRule { to { width:150px; } }
  @keyframes spTrack { to { opacity:1; letter-spacing:.32em; margin-right:-.32em; } }
  @keyframes spFade { to { opacity:1; } }
  @keyframes spSlide { from { transform:translateX(-110%); } to { transform:translateX(260%); } }
  @media (prefers-reduced-motion:reduce) { #splash * { animation-duration:.01ms !important; animation-delay:0s !important; transition:none !important; } }
  /* زرار احتياطى للكمبيوتر بس: لو الإطار ظهر فيه خطأ جوجل (401) يفتح التطبيق مباشرة */
  #fallback { display:none; position:fixed; left:12px; right:12px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:5; background:#0b0d0c; color:#fff; border-radius:14px; padding:14px; text-align:center; font-family:Cairo,system-ui,sans-serif; direction:rtl; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  #fallback.on { display:flex; flex-direction:column; gap:6px; align-items:center; }
  #fallback span { font-size:13px; color:#cfd8d3; }
  #fallback a { margin-top:4px; background:#16a352; color:#fff; text-decoration:none; font-weight:700; padding:9px 18px; border-radius:10px; }
  #direct { display:none; position:fixed; left:10px; bottom:10px; z-index:3; padding:6px 12px; border-radius:16px;
            background:rgba(17,17,17,.75); color:#fff; font:13px system-ui,"Segoe UI",Tahoma,sans-serif; text-decoration:none; }
  #direct:hover { background:var(--green); }
  @media (min-width:900px) and (pointer:fine) { #direct { display:block; } }
  /* رسالة زرار الرجوع */
  #backToast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(10px);
               background:rgba(17,17,17,.88); color:#fff; padding:10px 18px; border-radius:22px; font:600 14px system-ui,"Segoe UI",Tahoma,sans-serif;
               opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:5; white-space:nowrap; }
  #backToast.on { opacity:1; transform:translateX(-50%); }
</style>
</head>
<body>
<div id="splash" aria-label="GSH Maintenance CMMS">
  <div class="sp-center">
    <div class="sp-meters" id="spMeters"></div>
    <div class="sp-brand">
      <div class="sp-lg"><img src="logo.png" alt="Giza Seeds &amp; Herbs"><div class="sp-sheen"></div></div>
      <div class="sp-tag"><div class="sp-rule"></div><div class="sp-prod">GSH Maintenance · CMMS</div></div>
    </div>
  </div>
  <div class="sp-foot"><div class="sp-certs" aria-label="Certifications"><img src="certs/iso9001.png" alt="ISO 9001" onerror="this.remove()"><img src="certs/brcgs.png" alt="BRCGS" onerror="this.remove()"><img src="certs/halal.png" alt="HALAL" onerror="this.remove()"><img src="certs/smrp.png" alt="SMRP CMRP" onerror="this.remove()"><img src="certs/bestpractice.png" alt="Best Practice" onerror="this.remove()"></div><div class="sp-line"></div><div class="sp-say">الصيانة جاهزين دايماً</div></div>
</div>
<iframe id="app" title="GSH Maintenance"
        allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
        allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="backToast">اضغط رجوع مرة تانية للخروج</div>
<a id="direct" target="_top" title="لو ظهر خطأ 401 دوس هنا">فتح مباشر ↗</a>
<div id="fallback"><b>التطبيق مش بيفتح؟</b><span>هيفتح مباشر لوحده كمان ثواني…</span><a id="fbGo" target="_top">افتح مباشر دلوقتي</a></div>
<script>
  // رابط التطبيق الأصلى (Apps Script /exec). لو عملت Deploy جديد بلينك مختلف غيّر السطر ده بس.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwzJ_gI18hLDaTTtogeWoOiiGJGgvXV75FWRIIHUVt2L51JD-ZRVI4gYMAocz2bUmcmbA/exec';
  // بيعدّى ?asset=... و ?req=... للتطبيق عشان الـ QR ولينكات الطلبات تفتح على الماكينة/الطلب الصح
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  // ?direct=1 : يفتح التطبيق مباشرة من غير إطار (حل خطأ 401 على كمبيوتر فيه أكتر من حساب جوجل)
  var q = new URLSearchParams(location.search), direct = q.has('direct'); q.delete('direct');
  // v103 (19-Nov-2026): فتح من تليجرام كـ Mini App (من غير رسالة "Open Link").
  // اللينك t.me/<bot>?startapp=rq_RR-2611-053 -> تليجرام بيبعت tgWebAppStartParam -> نحوّله لـ ?rq=RR-2611-053 زى زمان.
  var inTg = false;
  (function(){
    var h = new URLSearchParams((location.hash || '').replace(/^#/, '')), sp = q.get('tgWebAppStartParam') || '';
    if (h.has('tgWebAppData') || q.has('tgWebAppStartParam')) inTg = true;
    if (!sp && h.has('tgWebAppData')) { try { sp = new URLSearchParams(h.get('tgWebAppData')).get('start_param') || ''; } catch(e){} }
    q.delete('tgWebAppStartParam');
    var m = /^(rq|wo|ob|asset)_([A-Za-z0-9-]{1,40})$/.exec(sp);
    if (m && !q.has(m[1])) q.set(m[1], m[2]);
    if (inTg) {
      var s = document.createElement('script'); s.src = 'https://telegram.org/js/telegram-web-app.js';
      s.onload = function(){ try { var w = window.Telegram && Telegram.WebApp; if (!w) return; w.ready(); w.expand();
        if (w.disableVerticalSwipes) w.disableVerticalSwipes(); } catch(e){} };
      document.head.appendChild(s);
    }
  })();
  // v78: موبايل التطبيق مافتحش جوه الإطار قبل كده (كوكيز جوجل ممنوعة) -> يفتح مباشر على طول. ?frame=1 يرجّعه للإطار.
  function lsG(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsS(k, v){ try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch(e){} }
  if (q.has('frame')) { q.delete('frame'); lsS('gshDirect', ''); }
  else if (lsG('gshDirect') === '1') direct = true;
  var qs = q.toString(), target = APP_URL + (qs ? '?' + qs : '');
  document.getElementById('direct').href = target; document.getElementById('fbGo').href = target;
  if (direct) { location.replace(target); }
  else { f.src = target; }
  // v78 (16-Nov-2026): لو التطبيق ما قالش "أنا اشتغلت" خلال 15 ثانية (غالباً الإطار ممنوع على الموبايل ده)
  // يظهر زرار "افتح مباشر"، ولو لسه مافتحش بعد 25 ثانية يفتح مباشر لوحده ويفتكر ده للمرات الجاية.
  var appOk = false;
  window.addEventListener('message', function(e){ if (e.data && e.data.gshApp) { appOk = true; var fb = document.getElementById('fallback'); if (fb) fb.className = ''; } });
  if (!direct) {
    setTimeout(function(){ if (!appOk) document.getElementById('fallback').className = 'on'; }, 15000);
    setTimeout(function(){ if (!appOk) { lsS('gshDirect', '1'); location.replace(target); } }, 25000);
  }
  // ---- شاشة الافتتاح (v3, 18-Nov-2026): فولتميتر + عداد ضغط + اللوجو بلمعة ضوء. بتشتغل وقت تحميل التطبيق وتختفى أول ما يحمّل (2.4 ثانية على الأقل) ----
  var loaded=false, gone=false, MIN=2.4;
  function hideSplash(){ if(gone) return; gone=true; sp.className='hide'; setTimeout(function(){ sp.className='hide gone'; },400); }
  f.addEventListener('load', function(){ loaded=true; });
  setTimeout(hideSplash, 10000);
  (function(){
    var GID=0;
    function meter(id,unit,max,lab,okFrom,okTo){
      var g='spg'+(++GID),CX=60,CY=60,R=45,A0=-135,A1=135,s='';
      function ang(v){return A0+(A1-A0)*v/max;}
      function pt(a,r){var t=(a-90)*Math.PI/180;return [CX+r*Math.cos(t),CY+r*Math.sin(t)];}
      s+='<defs><linearGradient id="'+g+'b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f5"/><stop offset=".5" stop-color="#c9d1cc"/><stop offset="1" stop-color="#8f9a94"/></linearGradient>'+
         '<radialGradient id="'+g+'f" cx=".5" cy=".38" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f0"/></radialGradient></defs>';
      s+='<circle cx="60" cy="60" r="58" fill="url(#'+g+'b)"/><circle cx="60" cy="60" r="53.5" fill="url(#'+g+'f)" stroke="#7d8882" stroke-width=".6"/>';
      var z0=pt(ang(okFrom),R-1),z1=pt(ang(okTo),R-1),lg=(ang(okTo)-ang(okFrom))>180?1:0;
      s+='<path d="M'+z0[0].toFixed(2)+' '+z0[1].toFixed(2)+' A'+(R-1)+' '+(R-1)+' 0 '+lg+' 1 '+z1[0].toFixed(2)+' '+z1[1].toFixed(2)+'" fill="none" stroke="#16a352" stroke-width="2.6"/>';
      var N=Math.round(max/lab*10),step=max/N;
      for(var i=0;i<=N;i++){var v=i*step,big=i%10===0,mid=!big&&i%5===0,a=pt(ang(v),R+2),b=pt(ang(v),R-(big?7:mid?4.5:3));
        s+='<line x1="'+a[0].toFixed(2)+'" y1="'+a[1].toFixed(2)+'" x2="'+b[0].toFixed(2)+'" y2="'+b[1].toFixed(2)+'" stroke="#1f2522" stroke-width="'+(big?1.1:.45)+'" stroke-linecap="round"/>';
        if(big){var l=pt(ang(v),R-14);s+='<text x="'+l[0].toFixed(2)+'" y="'+(l[1]+2.3).toFixed(2)+'" text-anchor="middle" font-family="Segoe UI,Roboto,Arial" font-weight="500" font-size="6.4" fill="#2a312d">'+Math.round(v)+'</text>';}}
      s+='<text x="60" y="84" text-anchor="middle" font-family="Segoe UI,Roboto,Arial" font-weight="600" font-size="8" letter-spacing=".8" fill="#5d6a63">'+unit+'</text>';
      s+='<g id="'+id+'"><path d="M60 '+(CY-R+3)+' L61.3 '+(CY+2)+' L60 '+(CY+10)+' L58.7 '+(CY+2)+'Z" fill="#c0392b"/></g>';
      s+='<circle cx="60" cy="60" r="4.2" fill="#1f2522"/><circle cx="60" cy="60" r="1.6" fill="#c9d1cc"/>';
      return {svg:'<div class="sp-meter"><svg viewBox="0 0 120 120" aria-hidden="true">'+s+'</svg></div>',ang:ang};
    }
    var V=meter('spNV','VOLT',300,100,200,240),P=meter('spNP','BAR',10,2,4,7);
    document.getElementById('spMeters').innerHTML=V.svg+P.svg;
    var nv=document.getElementById('spNV'),np=document.getElementById('spNP'),st=null;
    function spring(p){return 1-Math.exp(-5.5*p)*Math.cos(8*p);}
    function clamp(x){return x<0?0:x>1?1:x;}
    function tick(ts){
      if(gone) return; if(st===null) st=ts; var t=(ts-st)/1000;
      var p1=clamp((t-.3)/1.3),p2=clamp((t-.45)/1.3);
      var v=220*spring(p1)+(p1>=1?2.5*Math.sin(t*2.1)+1.2*Math.sin(t*6.3):0);
      var a=6*spring(p2)+(p2>=1?.12*Math.sin(t*1.7+1)+.06*Math.sin(t*7.1):0);
      nv.setAttribute('transform','rotate('+V.ang(Math.max(0,v)).toFixed(2)+' 60 60)');
      np.setAttribute('transform','rotate('+P.ang(Math.max(0,a)).toFixed(2)+' 60 60)');
      if(loaded && t>=MIN){ hideSplash(); return; }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
  // ---- زرار الرجوع فى الموبايل ----
  // الصفحة دى ماسكة تاريخ المتصفح: بنحط خطوة "حارس" واحدة. لما الحارس يتشال (رجوع) بنسأل التطبيق:
  // يقفل النافذة المفتوحة / يرجع لصفحة طلب الإصلاح (ونرجّع الحارس)، ولو هو أصلاً فيها -> رسالة، ورجوع تانى خلال 2.5 ثانية يخرج.
  (function(){
    if (direct || inTg || !history.pushState) return;   // جوه تليجرام زرار الرجوع بتاع تليجرام بيقفل النافذة
    var armed = false, wait = null, seq = 0, exitT = null, bt = document.getElementById('backToast');
    function arm(){ if (armed) return; try { history.pushState({gshGuard: 1}, ''); armed = true; } catch(e){} }
    function postAll(w, m){ try { w.postMessage(m, '*'); } catch(e){} try { for (var i = 0; i < w.length; i++) postAll(w[i], m); } catch(e){} }
    function exitArm(){
      clearTimeout(exitT); bt.className = 'on';
      exitT = setTimeout(function(){ exitT = null; bt.className = ''; arm(); }, 2500);   // ما ضغطش تانى -> نرجّع الحارس
    }
    function result(r){
      if (!wait) return; clearTimeout(wait.t); wait = null;
      if (r === 'exit') exitArm(); else arm();
    }
    window.addEventListener('message', function(e){
      var d = e.data; if (!d) return;
      if (d.gshApp && !exitT) arm();                       // التطبيق اتحمّل / المستخدم لمس الشاشة
      if (d.gshBackRes && wait && d.id === wait.id) result(d.gshBackRes);
    });
    window.addEventListener('popstate', function(){
      armed = false;
      if (exitT) return;                                   // (احتياط) الرجوع التانى بيخرج لوحده
      var id = ++seq; wait = { id: id, t: setTimeout(function(){ if (wait && wait.id === id) result('exit'); }, 700) };
      postAll(f.contentWindow, { gshBack: 1, id: id });
    });
  })();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
