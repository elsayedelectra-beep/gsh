<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GSH Maintenance</title>
<meta name="theme-color" content="#10582F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GSH Maintenance">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root { --green:#10582F; --black:#111; }
  html, body { margin:0; padding:0; height:100%; background:#fff; overflow:hidden; }
  #app { position:fixed; inset:0; width:100%; height:100%; height:100dvh; border:0; display:block; background:#fff; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:18px; background:#fff; color:var(--black); font-family:system-ui,"Segoe UI",Tahoma,sans-serif;
            transition:opacity .4s; z-index:2; }
  #splash.hide { opacity:0; pointer-events:none; }
  .logo { width:min(260px,70vw); height:auto; }
  .bar { width:140px; height:4px; border-radius:2px; background:#E3EEE6; overflow:hidden; }
  .bar i { display:block; width:40%; height:100%; background:var(--green); animation:slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0%{transform:translateX(160%)} 100%{transform:translateX(-260%)} }
  .t { font-size:18px; font-weight:600; letter-spacing:.3px; }
  .s { font-size:13px; color:#555; }
</style>
</head>
<body>
<div id="splash">
  <img class="logo" src="logo.png" alt="Giza Seeds &amp; Herbs">
  <div class="t">GSH Maintenance</div>
  <div class="bar"><i></i></div>
  <div class="s">جارى التحميل...</div>
</div>
<iframe id="app" title="GSH Maintenance"
        allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
        allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  // رابط التطبيق الأصلى (Apps Script /exec). لو عملت Deploy جديد بلينك مختلف غيّر السطر ده بس.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwzJ_gI18hLDaTTtogeWoOiiGJGgvXV75FWRIIHUVt2L51JD-ZRVI4gYMAocz2bUmcmbA/exec';
  // بيعدّى ?asset=... و ?req=... للتطبيق عشان الـ QR ولينكات الطلبات تفتح على الماكينة/الطلب الصح
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  f.src = APP_URL + (location.search || '');
  f.addEventListener('load', function(){ setTimeout(function(){ sp.className = 'hide'; }, 300); });
  setTimeout(function(){ sp.className = 'hide'; }, 8000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
