<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GSH Maintenance</title>
<meta name="theme-color" content="#10582F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GSH Maintenance">
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="icon" type="image/png" href="icon-192-v2.png">
<style>
  :root { --green:#10582F; --black:#111; }
  html, body { margin:0; padding:0; height:100%; background:#fff; overflow:hidden; }
  #app { position:fixed; inset:0; width:100%; height:100%; height:100dvh; border:0; display:block; background:#fff; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:26px; padding:0 14px; background:#fff; color:var(--black); font-family:system-ui,"Segoe UI",Tahoma,sans-serif;
            transition:opacity .35s ease; z-index:2; }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash.gone { display:none; }
  .sp-inst { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:330px; direction:ltr; }
  .sp-card { position:relative; border:1px solid #dbe4de; border-radius:18px; background:#fbfcfb; padding:12px 10px; opacity:0; transform:translateY(12px); animation:spUp .45s cubic-bezier(.2,.8,.2,1) forwards; }
  .sp-card:nth-child(2) { animation-delay:.1s; }
  .sp-card svg { width:100%; height:auto; display:block; overflow:visible; }
  .sp-tick { position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:50%; background:#0a6b35; display:grid; place-items:center; transform:scale(0); transition:transform .3s cubic-bezier(.3,1.6,.5,1); }
  .sp-tick.on { transform:scale(1); }
  .sp-tick svg { width:12px; height:12px; }
  .sp-logo { display:flex; flex-direction:column; align-items:center; gap:10px; width:240px; max-width:72%; opacity:0; transform:translateY(8px) scale(.97); filter:blur(6px); transition:opacity 1s ease, transform 1s cubic-bezier(.2,.8,.2,1), filter 1s ease; }
  .sp-logo.on { opacity:1; transform:none; filter:none; }
  .sp-logo img { width:240px; max-width:100%; display:block; }
  .sp-prod { font-weight:700; font-size:15px; letter-spacing:1.5px; color:#064a24; direction:ltr; opacity:0; transition:opacity .8s .5s ease; }
  .sp-logo.on .sp-prod { opacity:1; }
  .sp-status { position:absolute; bottom:calc(38px + env(safe-area-inset-bottom,0px)); left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .sp-track { width:170px; height:4px; border-radius:4px; background:#e3efe7; overflow:hidden; }
  .sp-bar { height:100%; width:0; background:linear-gradient(90deg,#e08a1e,#16a352 60%,#0a6b35); border-radius:4px; }
  .sp-label { font-size:13px; color:#6b7a72; direction:rtl; }
  .sp-label i { font-style:normal; display:inline-block; opacity:0; transform:translateY(4px); animation:spUp .5s ease forwards; }
  .sp-label i:nth-child(1){animation-delay:.3s} .sp-label i:nth-child(2){animation-delay:.6s} .sp-label i:nth-child(3){animation-delay:.9s}
  .sp-flash { animation:spFlash .4s 3; }
  @keyframes spUp { to { opacity:1; transform:none; } }
  @keyframes spFlash { 0%,100%{opacity:1} 50%{opacity:.35} }
  @media (prefers-reduced-motion:reduce) { #splash * { animation-duration:.01ms !important; animation-delay:0s !important; transition:none !important; } }
  /* زرار احتياطى للكمبيوتر بس: لو الإطار ظهر فيه خطأ جوجل (401) يفتح التطبيق مباشرة */
  #direct { display:none; position:fixed; left:10px; bottom:10px; z-index:3; padding:6px 12px; border-radius:16px;
            background:rgba(17,17,17,.75); color:#fff; font:13px system-ui,"Segoe UI",Tahoma,sans-serif; text-decoration:none; }
  #direct:hover { background:var(--green); }
  @media (min-width:900px) and (pointer:fine) { #direct { display:block; } }
  /* رسالة زرار الرجوع */
  #backToast { position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(10px);
               background:rgba(17,17,17,.88); color:#fff; padding:10px 18px; border-radius:22px; font:600 14px system-ui,"Segoe UI",Tahoma,sans-serif;
               opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:5; white-space:nowrap; }
  #backToast.on { opacity:1; transform:translateX(-50%); }
</style>
</head>
<body>
<div id="splash" aria-label="GSH Maintenance CMMS">
  <div class="sp-inst">
    <div class="sp-card">
      <span class="sp-tick" id="spOkV"><svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.6 9.6 3.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <svg viewBox="0 0 150 112" aria-hidden="true">
        <defs><linearGradient id="spVb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f1d"/><stop offset="1" stop-color="#0b0d0c"/></linearGradient></defs>
        <rect x="4" y="4" width="142" height="104" rx="14" fill="url(#spVb)"/>
        <rect x="12" y="12" width="126" height="74" rx="8" fill="#f7f5ec"/>
        <g id="spScale"></g>
        <text x="75" y="70" text-anchor="middle" font-family="monospace" font-weight="700" font-size="11" fill="#0b0d0c">V</text>
        <g id="spNeedle"><line x1="75" y1="82" x2="75" y2="26" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/></g>
        <circle cx="75" cy="82" r="5" fill="#0b0d0c"/><circle cx="75" cy="82" r="2" fill="#f7f5ec"/>
        <path id="spBolt" d="M22 92 l-6 9 h5 l-2 7 8-10 h-5 l3-6Z" fill="#e08a1e"/>
        <circle cx="110" cy="97" r="4" fill="#c0392b"/><circle cx="126" cy="97" r="4" fill="#0b0d0c" stroke="#3a3f3c"/>
        <text x="40" y="101" font-size="8" fill="#9aa59f">AC</text>
      </svg>
    </div>
    <div class="sp-card">
      <span class="sp-tick" id="spOkT"><svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.6 9.6 3.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <svg viewBox="0 0 150 112" aria-hidden="true">
        <defs>
          <linearGradient id="spTg" x1="0" x2="1"><stop offset="0" stop-color="#e08a1e"/><stop offset=".55" stop-color="#16a352"/><stop offset="1" stop-color="#0a6b35"/></linearGradient>
          <linearGradient id="spSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16a352"/><stop offset=".5" stop-color="#0a6b35"/><stop offset="1" stop-color="#064a24"/></linearGradient>
        </defs>
        <circle cx="75" cy="58" r="49" fill="none" stroke="#e3efe7" stroke-width="6"/>
        <circle id="spArc" cx="75" cy="58" r="49" fill="none" stroke="url(#spTg)" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 75 58)"/>
        <g id="spNut"><path d="M75 44 87.1 51 87.1 65 75 72 62.9 65 62.9 51Z" fill="#2a2f2c"/><path d="M75 44 87.1 51 75 58Z" fill="#3e4541"/><circle cx="75" cy="58" r="5.5" fill="#9aa59f"/><circle cx="75" cy="58" r="2.6" fill="#2a2f2c"/></g>
        <g id="spWrench">
          <path d="M92 53 L114 54.6 Q119 58 114 61.4 L92 63Z" fill="url(#spSteel)"/>
          <line x1="96" y1="58" x2="110" y2="58" stroke="#3fd07c" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
          <circle cx="75" cy="58" r="19" fill="none" stroke="url(#spSteel)" stroke-width="8"/>
          <circle cx="75" cy="58" r="15" fill="none" stroke="#064a24" stroke-width="1" stroke-dasharray="2.3 1.6"/>
          <circle cx="112" cy="58" r="1.8" fill="#fff"/>
        </g>
      </svg>
    </div>
  </div>
  <div class="sp-logo" id="spLogo"><img src="logo.png" alt="Giza Seeds &amp; Herbs"><div class="sp-prod">GSH Maintenance CMMS</div></div>
  <div class="sp-status"><div class="sp-track"><div class="sp-bar" id="spBar"></div></div><div class="sp-label"><i>الصيانة</i> <i>جاهزين</i> <i>دايماً</i></div></div>
</div>
<iframe id="app" title="GSH Maintenance"
        allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
        allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="backToast">اضغط رجوع مرة تانية للخروج</div>
<a id="direct" target="_top" title="لو ظهر خطأ 401 دوس هنا">فتح مباشر ↗</a>
<script>
  // رابط التطبيق الأصلى (Apps Script /exec). لو عملت Deploy جديد بلينك مختلف غيّر السطر ده بس.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwzJ_gI18hLDaTTtogeWoOiiGJGgvXV75FWRIIHUVt2L51JD-ZRVI4gYMAocz2bUmcmbA/exec';
  // بيعدّى ?asset=... و ?req=... للتطبيق عشان الـ QR ولينكات الطلبات تفتح على الماكينة/الطلب الصح
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  // ?direct=1 : يفتح التطبيق مباشرة من غير إطار (حل خطأ 401 على كمبيوتر فيه أكتر من حساب جوجل)
  var q = new URLSearchParams(location.search), direct = q.has('direct'); q.delete('direct');
  var qs = q.toString(), target = APP_URL + (qs ? '?' + qs : '');
  document.getElementById('direct').href = target;
  if (direct) { location.replace(target); }
  else { f.src = target; }
  // ---- شاشة الافتتاح: بتشتغل وقت تحميل التطبيق، وتختفى أول ما يحمّل (بعد 2.6 ثانية على الأقل) ----
  var loaded=false, gone=false, MIN=2.6;
  function hideSplash(){ if(gone) return; gone=true; sp.className='hide'; setTimeout(function(){ sp.className='hide gone'; },400); }
  f.addEventListener('load', function(){ loaded=true; });
  setTimeout(hideSplash, 10000);
  (function(){
    function $(id){ return document.getElementById(id); }
    var CX=75,CY=82,R=52,A0=-55,A1=55,VMAX=300,VT=220;
    function ang(v){ return A0+(A1-A0)*v/VMAX; }
    function pt(a,r){ var t=(a-90)*Math.PI/180; return [CX+r*Math.cos(t),CY+r*Math.sin(t)]; }
    var s='',g0=pt(ang(200),R),g1=pt(ang(240),R);
    s+='<path d="M'+g0[0].toFixed(1)+' '+g0[1].toFixed(1)+' A'+R+' '+R+' 0 0 1 '+g1[0].toFixed(1)+' '+g1[1].toFixed(1)+'" fill="none" stroke="#16a352" stroke-width="5"/>';
    for(var v=0;v<=VMAX;v+=10){ var big=v%50===0,a=pt(ang(v),R),b=pt(ang(v),R-(big?9:5)); s+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="#0b0d0c" stroke-width="'+(big?1.4:.7)+'"/>';
      if(v%100===0){ var l=pt(ang(v),R-17); s+='<text x="'+l[0].toFixed(1)+'" y="'+(l[1]+3).toFixed(1)+'" text-anchor="middle" font-family="monospace" font-size="8" fill="#0b0d0c">'+v+'</text>'; } }
    $('spScale').innerHTML=s;
    var wk=[[0,-110],[.26,-72],[.32,-78],[.58,-36],[.64,-42],[.92,0],[1,0]];
    function lerpK(k,p){ for(var i=1;i<k.length;i++){ if(p<=k[i][0]){ var a=k[i-1],b=k[i],u=(p-a[0])/(b[0]-a[0]); u=u*u*(3-2*u); return a[1]+(b[1]-a[1])*u; } } return 0; }
    function clamp(x){ return x<0?0:x>1?1:x; }
    function spring(p){ return 1-Math.exp(-6*p)*Math.cos(9*p); }
    var needle=$('spNeedle'),okV=$('spOkV'),bolt=$('spBolt'),wr=$('spWrench'),nut=$('spNut'),arc=$('spArc'),okT=$('spOkT'),logo=$('spLogo'),bar=$('spBar');
    var st=null,fv=false,ft=false,prog=0;
    function tick(ts){
      if(gone) return; if(st===null) st=ts; var t=(ts-st)/1000;
      var pv=clamp((t-.2)/1.2),v=VT*(pv>=1?1:spring(pv)); if(pv>=1) v=VT+4*Math.sin(t*2.3)+2.5*Math.sin(t*5.7+1)+1.2*Math.sin(t*13.1);
      needle.setAttribute('transform','rotate('+ang(Math.max(0,v)).toFixed(2)+' '+CX+' '+CY+')');
      if(pv>=1&&!fv){ fv=true; okV.classList.add('on'); bolt.setAttribute('fill','#16a352'); bolt.classList.add('sp-flash'); }
      var pw=clamp((t-.5)/1.6),a=lerpK(wk,pw);
      wr.setAttribute('transform','rotate('+a.toFixed(2)+' 75 58)');
      nut.setAttribute('transform','rotate('+((a+110)*0.55).toFixed(2)+' 75 58)');
      arc.setAttribute('stroke-dashoffset',(1-Math.pow(pw,1.6)).toFixed(3));
      if(pw>=1&&!ft){ ft=true; okT.classList.add('on'); }
      if(t>1.6) logo.classList.add('on');
      var goal=loaded?1:Math.min(.9,t/MIN*.9); prog+=(goal-prog)*.12; bar.style.width=(prog*100).toFixed(1)+'%';
      if(loaded && t>=MIN && prog>.97){ hideSplash(); return; }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
  // ---- زرار الرجوع فى الموبايل ----
  // الصفحة دى ماسكة تاريخ المتصفح: بنحط خطوة "حارس" واحدة. لما الحارس يتشال (رجوع) بنسأل التطبيق:
  // يقفل النافذة المفتوحة / يرجع لصفحة طلب الإصلاح (ونرجّع الحارس)، ولو هو أصلاً فيها -> رسالة، ورجوع تانى خلال 2.5 ثانية يخرج.
  (function(){
    if (direct || !history.pushState) return;
    var armed = false, wait = null, seq = 0, exitT = null, bt = document.getElementById('backToast');
    function arm(){ if (armed) return; try { history.pushState({gshGuard: 1}, ''); armed = true; } catch(e){} }
    function postAll(w, m){ try { w.postMessage(m, '*'); } catch(e){} try { for (var i = 0; i < w.length; i++) postAll(w[i], m); } catch(e){} }
    function exitArm(){
      clearTimeout(exitT); bt.className = 'on';
      exitT = setTimeout(function(){ exitT = null; bt.className = ''; arm(); }, 2500);   // ما ضغطش تانى -> نرجّع الحارس
    }
    function result(r){
      if (!wait) return; clearTimeout(wait.t); wait = null;
      if (r === 'exit') exitArm(); else arm();
    }
    window.addEventListener('message', function(e){
      var d = e.data; if (!d) return;
      if (d.gshApp && !exitT) arm();                       // التطبيق اتحمّل / المستخدم لمس الشاشة
      if (d.gshBackRes && wait && d.id === wait.id) result(d.gshBackRes);
    });
    window.addEventListener('popstate', function(){
      armed = false;
      if (exitT) return;                                   // (احتياط) الرجوع التانى بيخرج لوحده
      var id = ++seq; wait = { id: id, t: setTimeout(function(){ if (wait && wait.id === id) result('exit'); }, 700) };
      postAll(f.contentWindow, { gshBack: 1, id: id });
    });
  })();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
